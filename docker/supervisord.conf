[supervisord]
nodaemon=true
# Use stdout for logs (recommended for Cloud Run)
logfile=/dev/stdout
# Disable log rotation for stdout/stderr (non-seekable)
logfile_maxbytes=0
logfile_backups=0
pidfile=/app/tmp/supervisord.pid

[program:backend]
command=/bin/sh -lc '/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}'
directory=/app
autostart=true
autorestart=true
user=appuser
# Use stdout for logs
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=false
user=appuser
# Use stdout for logs
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0