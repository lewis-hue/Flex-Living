[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Ignore missing imports for third-party libraries
[mypy-motor.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-bson.*]
ignore_missing_imports = True

[mypy-pymongo.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

# Specific path configuration for flex_back module
[mypy-flex_back.*]
ignore_errors = False

# Handle app.* imports by treating them as part of the flex_back module
[mypy-flex_back.app.*]
ignore_errors = False

# Files in flex_back directory
[mypy-flex_back.f]
ignore_errors = False

[mypy-flex_back.test_implementation]
ignore_errors = False

[mypy-flex_back.create_test_user]
ignore_errors = False

[mypy-flex_back.init_test_user]
ignore_errors = False

[mypy-flex_back.init_auth_db]
ignore_errors = False

# Handle imports from flex_back in parent directory files
[mypy-test_review_pipeline]
ignore_errors = False

[mypy-analytics_data_check]
ignore_errors = False

# Special handling for app imports from outside flex_back
[mypy-app.*]
ignore_errors = True

# Fix for f.py file that needs app.* imports
[mypy-flex_back.f]
mypy_path = $MYPY_CONFIG_FILE_DIR/flex_back